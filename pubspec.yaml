name: tsundoku
description: A simple flutter app to make a record and save all the data of your physical books into one organized view..
publish_to: 'none'
version: 0.7.0

environment:
  sdk: '>=3.0.6 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.0
  intl: ^0.20.2
  csv: ^8.0.0
  path_provider: ^2.1.0
  file_picker: ^11.0.2
  logger: ^2.0.1
  permission_handler: ^12.0.1
  books_finder: ^4.4.0
  change_app_package_name: ^1.1.0
  flutter_barcode_scanner: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
