name: tsundoku
description: A simple flutter app to make a record and save all the data of your physical books into one organized view..
publish_to: 'none'
version: 0.8.0

environment:
  sdk: '>=3.0.6 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.0
  intl: ^0.20.2
  csv: ^8.0.0
  path_provider: ^2.1.0
  file_picker: ^11.0.2
  logger: ^2.0.1
  permission_handler: ^12.0.1
  books_finder:
    git:
      url: https://github.com/hilmihisham/books_finder
      ref: master
  change_app_package_name: ^1.1.0
  mobile_scanner: ^7.0.0
  settings_ui: ^3.0.1
  shared_preferences: ^2.4.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.1

flutter_launcher_icons:
  image_path: "assets/icons/icon-1.png"
  android: true
  ios: true

flutter_native_splash:
  color: "#C1E1C1"
  image: "assets/icons/icon-1.png"
  android: true
  ios: true
  android_12:
    color: "#C1E1C1"
    image: "assets/icons/splash-icon-1.png"
    icon_background_color: "#D2E9D2"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  path_provider_android: 2.3.1

flutter:
  uses-material-design: true
